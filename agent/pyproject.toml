[project]
name = "strandship-agent"
version = "1.0.0"
description = "AI code reviewer agent (GitHub Actions + OIDC variant) built on Strands Agents + Bedrock"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    # Strands Agents SDK + Bedrock model provider.
    "strands-agents>=0.1.0",
    # GitHub access in this variant uses the `gh` CLI (pre-installed on
    # GitHub-hosted runners) and local git, so no PyGithub dependency is needed.
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["strandship"]
